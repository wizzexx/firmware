; PlatformIO Project Configuration File
; Bruce firmware - Custom ESP32-S3 + ILI9341 2.8" Touch setup

##################################### CYD MODELS ####################################################
[CYD_base]
board = esp32-s3-devkitc-1
monitor_speed = 115200
board_build.partitions = custom_4Mb_full.csv
build_src_filter =${env.build_src_filter} +<../boards/CYD-2432S028>
build_unflags =
	-DUSE_HSPI_PORT
build_flags =
	${env.build_flags}
	${env_4mb.build_flags}
	-Iboards/CYD-2432S028

	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1

	-DCYD=1

	; Screen & SPI Fix for ESP32-S3 (Prevents 0x00000010 StoreProhibited panic)
	-DUSE_FSPI_PORT=1

	;Features Enabled
	;FM Radio
	-DFM_SI4713=1
	-DFM_RSTPIN=40
	-DPIN_CLK=-1
	-DI2S_SCLK_PIN=-1
	-DI2S_DATA_PIN=-1
	-DPIN_DATA=-1

	-DRGB_LED=-1
	-DBCLK=-1
	-DWCLK=-1
	-DDOUT=-1

	-DBAD_TX=GROVE_SDA
	-DBAD_RX=GROVE_SCL

	; SERIAL (GPS) dedicated pins
	-DSERIAL_TX=43
	-DSERIAL_RX=44
	-DGPS_SERIAL_TX=SERIAL_TX
	-DGPS_SERIAL_RX=SERIAL_RX

	;Buttons configuration
	-DHAS_BTN=0
	-DBTN_ALIAS='"Ok"'
	-DBTN_PIN=0

	;Infrared Led default pin and state
	-DIR_TX_PINS='{{"Pin 2", 2}, {"Pin 1", 1}}'
	-DIR_RX_PINS='{{"Pin 1", 1}, {"Pin 2", 2}}'
	-DTXLED=-1
	-DLED_ON=HIGH
	-DLED_OFF=LOW

	;Radio Frequency pin setting
	-DRF_TX_PINS='{{"Pin 2", 2}, {"Pin 1", 1}}'
	-DRF_RX_PINS='{{"Pin 1", 1}, {"Pin 2", 2}}'

	;Font sizes
	-DFP=1
	-DFM=2
	-DFG=3

	;Screen Setup
	-DHAS_SCREEN=1
	-DROTATION=1
	-DBACKLIGHT=-1
	-DMINBRIGHT=160
	-DTFT_BL=-1

	;TFT_eSPI Setup
	-DUSER_SETUP_LOADED=1
	-DILI9341_DRIVER=1
	-DTFT_HEIGHT=320
	-DTFT_WIDTH=240
	-DTFT_MISO=14
	-DTFT_MOSI=13
	-DTFT_SCLK=12
	-DTFT_CS=10
	-DTFT_DC=11
	-DTFT_RST=9
	-DTFT_BACKLIGHT_ON=HIGH
	-DSMOOTH_FONT=1

	;TouchScreen Controller
	-DHAS_TOUCH=1
	-DTOUCH_CS=4
	-DUSE_TFT_eSPI_TOUCH=1

	;SD Card Setup pins
	-DSDCARD_CS=-1
	-DSDCARD_SCK=-1
	-DSDCARD_MISO=-1
	-DSDCARD_MOSI=-1

	;tft Brightness Control
	-DTFT_BRIGHT_CHANNEL=0
	-DTFT_BRIGHT_Bits=8
	-DTFT_BRIGHT_FREQ=5000

	;Default I2C port
	-DGROVE_SDA=2
	-DGROVE_SCL=1

	-DSPI_SCK_PIN=12
	-DSPI_MOSI_PIN=13
	-DSPI_MISO_PIN=14
	-DSPI_SS_PIN=10

lib_deps =
	${env.lib_deps}

lib_ignore =
	${env_4mb.lib_ignore}


##################################### ACTIVE ENV ####################################################
[env:CYD-2432S028]
extends=CYD_base
build_flags =
	${CYD_base.build_flags}
	-DTFT_BL=-1
	-DSPI_FREQUENCY=40000000
	-DSPI_READ_FREQUENCY=16000000
	-DSPI_TOUCH_FREQUENCY=2500000
	-DTOUCH_CS=4
	-DUSE_TFT_eSPI_TOUCH=1
	-DDEVICE_NAME='"ESP32S3-TFT28"'

[env:LAUNCHER_CYD-2432S028]
extends=env:CYD-2432S028
board_build.partitions = custom_4Mb.csv
build_flags =
	${env:CYD-2432S028.build_flags}
	${env_light.build_flags}
lib_deps =
	${env_light.lib_deps}
